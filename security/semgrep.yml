rules:
  - id: no-dynamic-code
    languages: [typescript, javascript]
    severity: ERROR
    message: Não executar código gerado a partir de texto.
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
  - id: no-unsafe-prisma-query
    languages: [typescript, javascript]
    severity: ERROR
    message: Usar SQL parametrizado e identificadores controlados.
    pattern-either:
      - pattern: $DB.$queryRawUnsafe(...)
      - pattern: $DB.$executeRawUnsafe(...)
  - id: no-disabled-tls
    languages: [typescript, javascript]
    severity: ERROR
    message: Nunca desabilitar a verificação de certificados TLS.
    pattern-either:
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'
      - pattern: "{rejectUnauthorized: false, ...}"
  - id: no-shell-spawn
    languages: [typescript, javascript]
    severity: ERROR
    message: Executar processos por argumentos, sem interpretador de shell.
    pattern-either:
      - pattern: "spawn($CMD, $ARGS, {shell: true, ...})"
      - pattern: "spawnSync($CMD, $ARGS, {shell: true, ...})"
      - pattern: "exec(...)"
      - pattern: "execSync(...)"
  - id: no-unescaped-dom
    languages: [typescript, javascript]
    severity: ERROR
    message: Preferir textContent e interpolação Vue a HTML arbitrário.
    pattern-either:
      - pattern: $NODE.innerHTML = $VALUE
      - pattern: $NODE.outerHTML = $VALUE
  - id: no-vue-raw-html
    languages: [generic]
    paths:
      include: ['*.vue']
    severity: ERROR
    message: Evitar renderização de HTML arbitrário no Vue.
    pattern-regex: '\bv-html\s*='
